<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Station — Interactive Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="mark"></span> Dev Station</div>
      <button class="org-switcher" data-action="open-org-switcher">
        <span id="org-switcher-label">LogiqDev</span>
        <span style="display:inline-flex" id="org-switcher-chevron"></span>
      </button>
      <div class="spacer"></div>
      <div class="global-search">
        <div class="input-search">
          <span id="search-icon-slot" style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--color-ash);"></span>
          <input class="input" id="global-search-input" placeholder="Search projects, issues… (⌘K)" readonly />
        </div>
      </div>
      <div class="actions">
        <button class="btn-icon" data-action="open-settings" title="Settings"></button>
        <div class="avatar" title="Petros Rodinos">PR</div>
      </div>
    </header>

    <nav id="tabstrip"></nav>

    <div id="main">
      <aside id="rail"></aside>

      <main id="workspace">
        <div id="workspace-header"></div>
        <div id="workspace-content"></div>
      </main>

      <aside id="aipanel">
        <div id="aipanel-header"></div>
        <div id="aipanel-body"></div>
      </aside>
    </div>

    <footer id="statusbar"></footer>
  </div>

  <script src="js/components/icons.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/state/store.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/navRail.js"></script>
  <script src="js/components/tabStrip.js"></script>
  <script src="js/components/statusBar.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/git.js"></script>
  <script src="js/views/files.js"></script>
  <script src="js/views/linear.js"></script>
  <script src="js/views/notion.js"></script>
  <script src="js/views/integrations.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/org.js"></script>
  <script src="js/views/workspace.js"></script>
  <script src="js/panels/aiPanel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
