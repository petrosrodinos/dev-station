name: Release (Windows)

# Builds and publishes the Windows installer to GitHub Releases (on a separate releases-only
# account/repo — see app/package.json's build.publish), then syncs the API's "latest release"
# record so the in-app minVersion check and the /app-releases/download link pick it up.
#
# Trigger: push a tag matching vX.Y.Z that matches app/package.json's "version".
# Windows only for now (Spec: docs/superpowers/specs/2026-09-29-app-distribution-and-updates-design.md).
# Unsigned build — Windows SmartScreen will warn until code signing is added.

on:
  push:
    tags:
      - "v*.*.*"

# The default GITHUB_TOKEN only grants access to *this* repo — releases publish to a different
# account/repo (RELEASE_TARGET_TOKEN, a PAT from that account), so this repo doesn't need write.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          # This is an npm workspaces monorepo — install from the root lockfile, not a
          # per-package one (a stale standalone app/package-lock.json previously shadowed it
          # here and pulled in outdated/mismatched dependency versions).
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        working-directory: app
        run: npm run build

      - name: Publish to GitHub Releases
        working-directory: app
        env:
          # PAT from the releases account (logiqdevai/dev-agents-releases) — GITHUB_TOKEN can't
          # write outside this repo, so a same-repo token doesn't work here.
          GH_TOKEN: ${{ secrets.RELEASE_TARGET_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Resolve release version/asset
        id: release
        shell: bash
        env:
          RELEASES_REPO: logiqdevai/dev-agents-releases # keep in sync with app/package.json's build.publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "download_url=https://github.com/${RELEASES_REPO}/releases/download/${GITHUB_REF_NAME}/Dev-Station-Setup-${version}.exe" >> "$GITHUB_OUTPUT"

      - name: Sync latest release record on the API
        if: ${{ vars.RELEASE_API_URL != '' }}
        shell: bash
        continue-on-error: true # the GitHub Release is already published; don't fail the build over this
        run: |
          curl -fsS -X PATCH "${{ vars.RELEASE_API_URL }}/app-releases/win" \
            -H "Content-Type: application/json" \
            -H "x-release-token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}" \
            -d "{\"version\": \"${{ steps.release.outputs.version }}\", \"download_url\": \"${{ steps.release.outputs.download_url }}\"}"
