name: Release (Windows)

# Builds and publishes the Windows installer to GitHub Releases (on a separate releases-only
# account/repo — see app/package.json's build.publish), then syncs the API's "latest release"
# record so the in-app minVersion check and the /app-releases/download link pick it up.
#
# Trigger: push a tag matching vX.Y.Z that matches app/package.json's "version".
# Windows only for now (Spec: docs/superpowers/specs/2026-09-29-app-distribution-and-updates-design.md).
# Unsigned build — Windows SmartScreen will warn until code signing is added.

on:
  push:
    tags:
      - "v*.*.*"

# The default GITHUB_TOKEN only grants access to *this* repo — releases publish to a different
# account/repo (RELEASE_TARGET_TOKEN, a PAT from that account), so this repo doesn't need write.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          # This is an npm workspaces monorepo — install from the root lockfile, not a
          # per-package one (a stale standalone app/package-lock.json previously shadowed it
          # here and pulled in outdated/mismatched dependency versions).
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        working-directory: app
        env:
          # Baked into the renderer bundle at build time by Vite (see src/config/environments) —
          # hardcoded for now until these are wired up as repo variables.
          VITE_API_URL: "https://api.devstation.logiqdev.com"
          VITE_APP_URL: "https://app.devstation.logiqdev.com"
          VITE_LANDING_URL: "https://devstation.logiqdev.com"
        run: npm run build

      - name: Ensure the release tag exists on the releases repo
        # electron-builder's releaseType: "release" (non-draft) requires the tag to already
        # exist as a real ref on the *target* repo — unlike a draft, GitHub won't auto-create
        # it, and since the releases repo's git history is unrelated to this one, electron-
        # builder has no commit there to anchor a new tag to. Create it explicitly first.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TARGET_TOKEN }}
          RELEASES_REPO: logiqdevai/dev-agents-releases # keep in sync with app/package.json's build.publish
        run: |
          if gh api "repos/${RELEASES_REPO}/git/refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Tag ${GITHUB_REF_NAME} already exists on ${RELEASES_REPO}"
          else
            default_branch=$(gh api "repos/${RELEASES_REPO}" --jq .default_branch)
            head_sha=$(gh api "repos/${RELEASES_REPO}/git/refs/heads/${default_branch}" --jq .object.sha)
            gh api "repos/${RELEASES_REPO}/git/refs" -f ref="refs/tags/${GITHUB_REF_NAME}" -f sha="${head_sha}"
            echo "Created tag ${GITHUB_REF_NAME} on ${RELEASES_REPO} at ${head_sha}"
          fi

      - name: Create the release as a draft
        # electron-builder creates a missing release with one POST per artifact, and those uploads run
        # in parallel, so the second POST fails with 422 already_exists and the job dies after the exe
        # is already public and before latest.yml is uploaded (v0.1.0, v0.1.1, v0.1.4). Creating a draft
        # here first makes electron-builder find it on its releases list, so every upload lands on the
        # same release. The draft stays hidden until the publish step flips it live.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TARGET_TOKEN }}
          RELEASES_REPO: logiqdevai/dev-agents-releases # keep in sync with app/package.json's build.publish
        run: |
          existing_id=$(gh api "repos/${RELEASES_REPO}/releases?per_page=100" --paginate --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id")
          if [ -n "$existing_id" ]; then
            echo "Release ${GITHUB_REF_NAME} already exists on ${RELEASES_REPO} (id ${existing_id})"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
            echo "Created draft release ${GITHUB_REF_NAME} on ${RELEASES_REPO}"
          fi

      - name: Publish to GitHub Releases
        working-directory: app
        env:
          # PAT from the releases account (logiqdevai/dev-agents-releases) — GITHUB_TOKEN can't
          # write outside this repo, so a same-repo token doesn't work here.
          GH_TOKEN: ${{ secrets.RELEASE_TARGET_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Publish the release
        # Flip the draft live only once electron-builder has uploaded every asset (exe, blockmap, latest.yml).
        # No-op when the release was already published by an earlier attempt.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TARGET_TOKEN }}
          RELEASES_REPO: logiqdevai/dev-agents-releases # keep in sync with app/package.json's build.publish
        run: gh release edit "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft=false

      - name: Resolve release version/asset
        id: release
        shell: bash
        env:
          RELEASES_REPO: logiqdevai/dev-agents-releases # keep in sync with app/package.json's build.publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "download_url=https://github.com/${RELEASES_REPO}/releases/download/${GITHUB_REF_NAME}/Dev-Station-Setup-${version}.exe" >> "$GITHUB_OUTPUT"

      - name: Sync latest release record on the API
        if: ${{ vars.RELEASE_API_URL != '' }}
        shell: bash
        continue-on-error: true # the GitHub Release is already published; don't fail the build over this
        run: |
          curl -fsS -X PATCH "${{ vars.RELEASE_API_URL }}/app-releases/win" \
            -H "Content-Type: application/json" \
            -H "x-release-token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}" \
            -d "{\"version\": \"${{ steps.release.outputs.version }}\", \"download_url\": \"${{ steps.release.outputs.download_url }}\"}"
